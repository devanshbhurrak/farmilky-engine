name = "farmilky-engine"
main = "src/worker.ts"
compatibility_date = "2026-10-28"
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]

# Hyperdrive pools Postgres connections at the edge. Create the config with:
#   wrangler hyperdrive create farmilky-db --connection-string="postgresql://..."
# then uncomment and paste the returned id.
# The Worker connects directly to Neon via @neondatabase/serverless (over HTTP),
# so Hyperdrive is optional. Enable it if you want connection pooling at the edge.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "REPLACE_WITH_HYPERDRIVE_CONFIG_ID"

# Native R2 binding used for product images in the Worker.
# The bucket must already exist in the same Cloudflare account.
# Create it with:   wrangler r2 bucket create farmilky-products
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "farmilky-products"

# Durable Object that owns all SSE connections so broadcasts cross isolates.
[[durable_objects.bindings]]
name = "SSE_HUB"
class_name = "SseHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SseHub"]

# Secrets (set with `wrangler secret put <NAME>`):
#   DATABASE_URL              - Neon connection string (postgresql://..., not postgresql+asyncpg://)
#   JWT_ACCESS_SECRET         - min 32 chars
#   JWT_REFRESH_SECRET        - min 32 chars
#   CRON_SECRET               - min 16 chars
#   R2_ACCESS_KEY_ID          - only for Node-only/S3 fallback deployments
#   R2_SECRET_ACCESS_KEY      - only for Node-only/S3 fallback deployments
# R2 binding (IMAGES above) provides direct bucket access; access keys are not
# required when using the R2 binding from the Worker.

# ...
[vars]
ALLOWED_ORIGINS = "https://farmilky-console.farmilky.workers.dev"
BACKEND_URL = "https://farmilky-engine.farmilky.workers.dev"
BRAND_PHONE = "9244237975"
NODE_ENV = "production"
R2_ACCOUNT_ID = "de769baf27e77f58f883fb20c2df7a3f"
R2_BUCKET_NAME = "farmilky-products"
R2_KEY_PREFIX = "products"
UPI_ID = "9424547907@slc"
UPI_NAME = "Farmilky"
# ...


# Cron schedules are UTC. See src/worker.ts for the IST mapping.
[triggers]
crons = ["30 23 * * *", "30 17 * * *", "30 20 28-31 * *"]
